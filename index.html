<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家族アルバム">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/[ID]">
  <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/[ID]">

  <title>家族アルバム</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.3.7/photoswipe.min.css">
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <header>
    <h1>家族アルバム</h1>
  </header>

  <main class="container">
    <section id="section-view">
      <div id="album-list"></div>
      <div class="bottom-controls">
        <button id="btn-show-create" class="btn-secondary">＋ 新しいアルバムを作成</button>
      </div>
    </section>

    <section id="section-create" style="display:none;">
      <div class="card">
        <div class="album-header">
          <button class="back-btn" id="btn-back-from-create">← 戻る</button>
          <h3>新規作成</h3>
        </div>
        <input type="text" id="eventName" placeholder="例: 2026年 家族旅行">
        <button id="btn-create">フォルダを作成する</button>
      </div>
    </section>

    <section id="section-photos" style="display:none;">
      <div class="album-header">
        <button class="back-btn" id="btn-back-to-list">← 一覧に戻る</button>
        <h3 id="current-album-name"></h3>
      </div>
      <div class="card memo-card">
        <textarea id="album-memo" placeholder="場所や思い出をメモ..." rows="3"></textarea>
        <button id="btn-save-memo" class="btn-small">メモを保存</button>
        <div id="memo-status" class="status-text"></div>
      </div>
      <div class="upload-area">
        <label class="upload-label" for="file-upload">📷 写真を追加する</label>
        <input id="file-upload" type="file" multiple accept="image/*" style="display:none;">
        <div id="upload-status" class="message" style="display:none;"></div>
      </div>
      <div id="photo-grid" class="grid pswp-gallery"></div>
    </section>
  </main>

  <div id="loading" class="loading-overlay" style="display:none;">
    <div style="text-align:center;">
      <div class="spinner"></div>
      <div id="loading-text" style="margin-top:10px; font-weight:bold;">処理中...</div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
