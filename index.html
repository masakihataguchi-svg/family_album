<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <!-- PWA設定: ホーム画面でアプリのように表示する設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="家族アルバム">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- 【更新】ご指定の新しいアイコン画像URL -->
  <!-- ID: 1fKKLtWircIxr1YO6YGRjto8KDL4EI1Sn -->
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1fKKLtWircIxr1YO6YGRjto8KDL4EI1Sn?v=1">
  <link rel="icon" sizes="192x192" href="https://lh3.googleusercontent.com/d/1fKKLtWircIxr1YO6YGRjto8KDL4EI1Sn?v=1">

  <title>家族アルバム</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  
  <!-- 外部ライブラリ (EXIF解析: HEIC対応版) -->
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  
  <!-- 設定ファイル (GASのURLを記述) -->
  <script src="config.js"></script>
</head>
<body>
  <header>
    <h1>家族アルバム</h1>
  </header>

  <main class="container">
    <!-- 1. アルバム一覧セクション (初期表示) -->
    <section id="section-view">
      <div id="album-list"></div>
      <div class="bottom-controls">
        <button id="btn-show-create" class="btn-secondary">＋ 新しいアルバムを作成</button>
      </div>
    </section>

    <!-- 2. アルバム作成セクション -->
    <section id="section-create" style="display:none;">
      <div class="card">
        <div class="album-header">
          <button class="back-btn" onclick="showSection('view')">← 戻る</button>
          <h3>新規作成</h3>
        </div>
        <p class="guide-text">イベント名を入力してください</p>
        <input type="text" id="eventName" placeholder="例: 2026年 家族旅行">
        <button id="btn-create">フォルダを作成する</button>
        <div id="create-msg" class="message" style="display:none;"></div>
      </div>
    </section>

    <!-- 3. 写真閲覧セクション -->
    <section id="section-photos" style="display:none;">
      <div class="album-header">
        <button class="back-btn" id="btn-back-to-list">← 一覧に戻る</button>
        <h3 id="current-album-name"></h3>
      </div>
      <div class="upload-area">
        <label class="upload-label" for="file-upload">📷 写真を追加する</label>
        <input id="file-upload" type="file" multiple accept="image/*" style="display:none;">
        <div id="upload-status" class="message" style="display:none;"></div>
      </div>
      <div id="photo-grid" class="grid"></div>
    </section>
  </main>

  <!-- 処理中のローディング表示 -->
  <div id="loading" class="loading-overlay" style="display:none;">処理中...</div>

  <!-- メインロジック -->
  <script src="script.js"></script>
</body>
</html>
